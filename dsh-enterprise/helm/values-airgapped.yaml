# Helm values for air-gapped bank/insurance — registry + PG + R2 internal
imageRegistry: registry.bank.internal
imagePullSecrets:
  - name: regcred
pg:
  host: postgres.internal
  port: 5432
  ssl: true
  walArchive: s3://wal-archive
r2:
  endpoint: https://s3.internal
  region: eu-west-1
  objectLock: true
gateway:
  allowedRegions: [eu-west-1, eu-west-3]
  providerAuth: vault # HSM via Vault Transit
resilience:
  rtoHours: 4
  rpoSeconds: 0
  replicaRegion: eu-west-3
sbom:
  failOnCritical: true
