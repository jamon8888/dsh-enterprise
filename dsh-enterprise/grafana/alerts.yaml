# Grafana alert rules — enterprise (Postgres run_events + budgets + iit-config)
# Datasource: Postgres `run_events`; thresholds from budgets.ts spendCounters, iit-config.yaml minPhi, EWS limits.

apiVersion: 1
groups:
  - name: dsh-enterprise
    interval: 1m
    rules:
      - uid: cost_budget_exceeded
        title: "Cost > budget (spendCounters)"
        condition: "A"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Postgres
            model:
              rawSql: >
                SELECT org_id, project_id, SUM((cost->>'cents')::int) AS spent_cents
                FROM run_events
                WHERE created_at > NOW() - INTERVAL '1 hour'
                GROUP BY org_id, project_id
              format: table
        annotations:
          summary: "Cost exceeds budget — spendCounters (budgets.ts) hardBudgetBlock threshold"
          description: "Fires when SUM(envelope.cost.cents) per org/project exceeds budgetDef.limitCents (checked via Gateway hardBudgetBlock/spendCounters). Resolve via budgets.ts or MAX_COST_USD env."
        labels: { severity: critical, source: "budgets.ts:spendCounters" }
        # expr: spent_cents > budget_limit_cents (joined against budgets table in Postgres; in-memory check is spendCounters Map)
        for: 2m

      - uid: phi_below_min
        title: "Phi < minPhi (iit-config.yaml)"
        condition: "A"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Postgres
            model:
              rawSql: >
                SELECT created_at AS time, (phi_snapshot->>'phi')::float AS phi
                FROM run_events
                ORDER BY created_at DESC LIMIT 1
              format: time_series
        annotations:
          summary: "phi below minPhi from .dsh/iit-config.yaml"
          description: "Fires when latest run_events.phi_snapshot.phi < minPhi (guards-iit/config.ts DEFAULT_CONFIG.minPhi, rendered to .dsh/iit-config.yaml). Check iit-core phi trajectory."
        labels: { severity: warning, source: "iit-config.yaml:minPhi" }
        # expr: phi < $minPhi (default 0.1)
        for: 2m

      - uid: ews_threshold_exceeded
        title: "EWS variance/ac1 > threshold"
        condition: "A"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Postgres
            model:
              rawSql: >
                SELECT created_at AS time,
                       (ews->>'variance')::float AS variance,
                       (ews->>'ac1')::float AS ac1
                FROM run_events
                WHERE ews IS NOT NULL
                ORDER BY created_at DESC LIMIT 1
              format: time_series
        annotations:
          summary: "EWS variance or ac1 exceeds threshold (attractor-ews guard)"
          description: "Fires when run_events.ews.variance > varianceLimit (2.0) or ews.ac1 > acLimit (0.7) — mirrors guards-iit/attractor-ews Config. Source: iit/ews audit event / Rust attractor.rs."
        labels: { severity: warning, source: "iit/ews" }
        for: 2m
