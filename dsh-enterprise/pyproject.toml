[project]
name = "dsh-enterprise-ict-bridge"
version = "0.1.0"
description = "Python bridge for ICT notebooks (measured, Gates-truthy)"
requires-python = "==3.9.*"
dependencies = [
  "numpy<2",
  "pyphi==1.2.0",
]

[dependency-groups]
dev = ["pytest", "ruff>=0.12", "pyright>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["IIT", ".venv", "target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
managed = true
