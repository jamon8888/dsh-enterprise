pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm -r exec tsc --noEmit
      tags: [frontend, typecheck]
    oxlint:
      run: pnpm exec oxlint --deny-warnings src/ packages/*/src/
      tags: [frontend, lint]
    cargo-check:
      run: cargo check --manifest-path packages/iit-core/Cargo.toml
      tags: [rust, check]

pre-push:
  commands:
    test:
      run: cargo test --manifest-path packages/iit-core/Cargo.toml && pnpm -r exec vitest run
      tags: [test]
