# pyproject.toml — AAR Bridge Python sidecar
[project]
name = "dsh-enterprise-aar-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
aar = [
    "torch>=2.0",
    "transformers>=4.40",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
